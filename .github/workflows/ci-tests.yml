          --require Tesserafin.Server.Integration.Tests.ItemImageProcessingEndToEndTests.CancelledHttpDownload_PreservesRemoteRowsAndCache_AndReleasesAdmissionForRetry
          --require Tesserafin.Server.Integration.Tests.ItemImageProcessingEndToEndTests.DeletionBetweenPreparationAndCommit_DoesNotResurrectTheItemOrCache
          --require Tesserafin.Server.Integration.Tests.ItemImageProcessingEndToEndTests.PermanentlyRejectedImage_IsRemovedOnce_WithoutRetryingOrChangingTheMedia
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayFilmEndToEndTests.Film_StartAndSeek_ServesRangesFromTheSessionFile
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayFilmEndToEndTests.Episode_StartAndSeek_ServesRangesFromTheSessionFile
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayFilmEndToEndTests.HomeVideo_StartAndSeek_ServesRangesFromTheSessionFile
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayFilmEndToEndTests.MusicVideo_StartAndSeek_ServesRangesFromTheSessionFile
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayAudioEndToEndTests.Audio_StartAndSeek_ServesRangesFromTheSessionFile
          --require Tesserafin.Server.Integration.Tests.EndToEnd.DirectPlayAudioEndToEndTests.AudioBook_StartAndSeek_ServesRangesFromTheSessionFile
