# ARMED on 2026-07-27 (#94). Both blockers are gone.
#
# 1. Allocation. Run 30229812748 — job "ABI - HEAD" completed/SUCCESS with 8
#    executed steps on runner "GitHub Actions 1000000000" — the exact opposite
#    of the parked signature (failure in 3-4 s, zero steps, no runner).
#
# 2. Native dependencies. Run 30230606313 failed 2 MediaEncoding and 12
#    PlaybackUrlContract end-to-end tests on a bare runner. Installing ffmpeg
#    and libfontconfig1 — the same packages Dockerfile.ci installs — plus
#    filtering Category!=Smoke to match ./ci/run.sh exactly cleared 13 of
#    those 14 (run 30231076754).
#
# 3. The last one, OpenApiContractTests.CommittedContract_MatchesRunningServer,
#    was a real reproducibility defect in the server and is fixed in this same
#    commit: the XML documentation files were fed to Swashbuckle in
#    filesystem order, so the generated contract differed between machines.
#    Local and hosted now agree byte for byte on
#    sha256 ab2fa4fbb2d420e75205837c4fd7be2d80799149fa4e34c33e94713c78746744.
#
# 4. Since [C1.1] (#151) that ordering is also guarded repository-locally by
#    OpenApiXmlDocumentationOrderTests, which drives the canonical order with
#    explicit permutations and fails on ANY machine if it is weakened — the
#    hosted job is no longer the only thing standing between the contract and
#    a silent cross-machine divergence. On failure this job now retains both
#    documents as a short-retention artifact.
#
# This job is the CROSS-MACHINE half of the contract guard.
# OpenApiContractTests.Contract_IsByteIdentical_AcrossColdGenerations only
# reboots the application on one filesystem, where the enumeration order is
# stable; it cannot catch an order that differs between hosts. Running the
# same test on a hosted runner can, and that is what caught this one.
#
# Required status checks: since branch protection became available on master,
# `run-tests (ubuntu-latest)` and `integration-tests (ubuntu-latest)` are both
# required contexts (see "What runs in CI" in BUILDING.md). A job skipped by its
# own `if:` reports under its bare name, before matrix expansion, so the
# required context stays missing and blocks the merge rather than passing.
#
# ── Parking stamp (historical, 2026-07-19 allocation outage) ───────────────
# PARKED — manual trigger only (issue #62). GitHub refuses to allocate a
# hosted runner for this PRIVATE repo BEFORE the first step (account-wide
# 2000 free minutes/month exhausted, spending limit $0), so this went red on
# every pull request and every push to master without running a single step.
# Nothing is fixed here — the trigger is disarmed to stop the noise.
#
# The test suite is NOT unguarded meanwhile: the mandatory merge gate during
# the outage is the local Docker CI (./ci/run.sh, which purges bin/ + obj/
# itself before compiling anything — see #94),
# which runs the same `dotnet build` + `dotnet test` over Tesserafin.sln.
# See docs/local-ci.md.
#
# Previous trigger: on: push (master) + pull_request
# (Original note kept for the restore: PRs run against the forked branch
# without access to secrets —
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflows-in-forked-repositories)
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [master]
    # Minute economy: a documentation-only change cannot break the build or
    # the test suite. This is safe HERE because this workflow contains no
    # security analysis — CodeQL must never carry a documentation exclusion.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    # NO paths-ignore, deliberately. `Tests` is about to become a REQUIRED status
    # check on the protected `master`. A path-filtered `pull_request` trigger does
    # not start the workflow at all, so no check run is ever created, so a required
    # check sits at "Expected — waiting for status to be reported" forever and the
    # pull request can never merge. A documentation-only pull request would be
    # permanently unmergeable. The extra minutes are the deliberate price of a
    # required check that can actually report.
    #
    # The `push` trigger above keeps its exclusion: nothing gates on it.
    #
    # `ready_for_review` is REQUIRED here for the same "a required check must be
    # able to report" reason. `run-tests` is draft-gated below, and without this
    # type the default set (opened, synchronize, reopened) means marking a draft
    # ready fires no run at all: the draft-time "skipping" result stays the last
    # one recorded, a skipped required check never satisfies protection, and the
    # pull request is unmergeable until somebody pushes an unrelated commit.
    # Observed on #227.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"
  # Code coverage through coverlet.MTP (Microsoft.Testing.Platform). These are the
  # settings the former VSTest runsettings file carried: Cobertura,
  # generated/obsolete code excluded, auto-properties skipped. Its Moq and
  # coverlet-self exclusions are dropped: coverlet.MTP only instruments
  # assemblies with sources (Moq never appeared), and a whole-solution run
  # passing --coverlet-exclude crashes the test modules before they report.
  COVERAGE_ARGS: >-
    --coverlet --coverlet-output-format cobertura
    --coverlet-exclude-by-attribute Obsolete
    --coverlet-exclude-by-attribute GeneratedCodeAttribute
    --coverlet-exclude-by-attribute CompilerGeneratedAttribute
    --coverlet-skip-auto-props

jobs:
  run-tests:
    # Minute economy: draft pull requests do not spend runner time. Marking a
    # pull request ready for review triggers a fresh run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    # Minute economy: a hard ceiling. Without it a hung test run bills up to
    # the 6-hour default. The local gate finishes the same work in ~5 min.
    timeout-minutes: 30

    strategy:
      # See the OS matrix note in the restoration stamp: automatic runs are
      # ubuntu-latest only, because macOS (x10) and Windows (x2) minute
      # multipliers are what exhausted the free allowance in July 2026. The
      # full matrix stays reachable by hand through workflow_dispatch.
      matrix:
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
      # Minute economy: stop the remaining OS legs as soon as one fails.
      # Nothing here needs the full failure matrix to be actionable.
      fail-fast: true

    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      # Minute economy: NuGet restore is the single most repetitive cost in
      # this job. The local gate caches it in a named Docker volume; this is
      # the hosted equivalent.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Same native dependencies Dockerfile.ci installs for the local gate.
      # Without ffmpeg the MediaEncoding and PlaybackUrlContract end-to-end
      # tests fail on a bare hosted runner even though the tree is sound —
      # proven by run 30230606313, which failed 2 MediaEncoding and 12
      # Integration tests for exactly that reason. libfontconfig1 is what
      # SkiaSharp.NativeAssets.Linux needs. This is what makes the hosted job
      # equivalent to ./ci/run.sh rather than a weaker approximation of it.
      #
      # The Azure Ubuntu mirror answers `apt-get update` in seconds but can stall
      # on individual .deb downloads: on 2026-10-27 this step took 213 s, 251 s
      # and over 313 s (runs 40563807559, 40567555335, 40576004694) against a
      # usual 15-30 s, and on 2026-10-22 it took 19 and 30 minutes. Keep the
      # downloaded archives between runs so a normal run fetches nothing, and
      # bound the step so a stalled mirror fails fast and visibly instead of
      # eating the job's 30-minute ceiling. Key on the runner image: a new image
      # restores the previous archives and downloads only what changed. The
      # cache only spares downloads; versions are still resolved against fresh
      # package lists. Caches written by a pull request are visible to that
      # pull request only; master pushes seed the shared one.
      - name: Native package cache key
        id: native-key
        if: runner.os == 'Linux'
        run: |
          echo "prefix=native-debs-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=native-debs-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache native test packages
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/native-test-debs
          key: ${{ steps.native-key.outputs.key }}
          restore-keys: ${{ steps.native-key.outputs.prefix }}

      - name: Install native test dependencies
        if: runner.os == 'Linux'
        # integration-tests needs up to ~21 minutes besides this step, so 8
        # minutes is the most apt can take without the job timing out anyway.
        timeout-minutes: 8
        run: ci/install-native-test-deps.sh

      # Tests in the Tesserafin.Server.Integration.Tests namespace are excluded
      # here by name and run in integration-tests, which runs only that project.
      # One declared in any other project would therefore run in neither job.
      - name: Check the unit/integration partition
        shell: bash
        run: |
          if grep -rlE --include='*.cs' '^[[:space:]]*namespace[[:space:]]+Tesserafin\.Server\.Integration\.Tests([.;{[:space:]]|$)' . \
            | grep -v '^\./tests/Tesserafin\.Server\.Integration\.Tests/'; then
            echo "::error::The files above declare the Tesserafin.Server.Integration.Tests namespace outside that project, so neither run-tests nor integration-tests would run their tests."
            exit 1
          fi

      - name: Run DotNet CLI Tests
        id: tests
        # --filter matches ci/run.sh exactly: Category=Smoke is the optional,
        # explicitly non-blocking stage (PR115d), invoked by ./ci/smoke.sh.
        # Tesserafin.Server.Integration.Tests runs in the integration-tests job
        # below instead: on its own it takes 17-19 minutes, and together with
        # the rest of the suite and a slow apt mirror it pushed this job past
        # its 30-minute ceiling after every test had passed (run 40567555335).
        # Every class of that project, and no class elsewhere, sits under that
        # namespace, so the two filters partition the suite exactly.
        # Minute economy: coverage instrumentation and the ReportGenerator step
        # below run on master pushes only. On a pull request the question is
        # "does it build and pass", and coverage roughly doubles the test
        # stage for an answer nobody reads on the pull request itself.
        # The tests run on Microsoft.Testing.Platform (global.json "test.runner").
        # The integration project matches no test under this filter and exits 8
        # ("zero tests"); that code is ignored here, and the result check below
        # is what rejects a run that executed nothing. --hangdump writes a dump of
        # a test process that stops making progress, uploaded on failure.
        run: >
          dotnet test --solution Tesserafin.sln
          --configuration Release
          --filter 'Category!=Smoke&FullyQualifiedName!~Tesserafin.Server.Integration.Tests.'
          --ignore-exit-code 8
          ${{ github.event_name == 'push' && env.COVERAGE_ARGS || '' }}
          --report-trx
          --results-directory artifacts/test-results/unit
          --hangdump --hangdump-timeout 20m
          --no-progress

      # `dotnet test` exits 0 when the filter matches nothing, so without this a
      # broken filter or target would report a green check that ran no test.
      - name: Check test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: '"$(command -v python3 || command -v python)" ci/summarize-test-results.py artifacts/test-results/unit'

      - name: Retain hang dumps
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hang-dumps-unit-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/test-results/unit/**/*.dmp
          if-no-files-found: ignore
          retention-days: 3

      - name: Merge code coverage results
        if: ${{ github.event_name == 'push' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # v5.5.10
        with:
          reports: "artifacts/test-results/**/coverage.cobertura*.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      # TODO - which action / tool to use to publish code coverage results?
      # - name: Publish code coverage results

  integration-tests:
    # The real-server end-to-end suite, split out of run-tests so each job has
    # its own 30-minute ceiling. Same trigger gate, matrix, runner setup and
    # native dependencies as run-tests: the end-to-end tests are the ones that
    # need ffmpeg (run 30230606313).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
      fail-fast: true
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Native package cache key
        id: native-key
        if: runner.os == 'Linux'
        run: |
          echo "prefix=native-debs-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=native-debs-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache native test packages
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/native-test-debs
          key: ${{ steps.native-key.outputs.key }}
          restore-keys: ${{ steps.native-key.outputs.prefix }}

      - name: Install native test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: ci/install-native-test-deps.sh

      - name: Run integration tests
        id: tests
        # Same Category filter and coverage switch as run-tests.
        run: >
          dotnet test --project tests/Tesserafin.Server.Integration.Tests/Tesserafin.Server.Integration.Tests.csproj
          --configuration Release
          --filter 'Category!=Smoke'
          ${{ github.event_name == 'push' && env.COVERAGE_ARGS || '' }}
          --report-trx
          --results-directory artifacts/test-results/integration
          --hangdump --hangdump-timeout 20m
          --no-progress

      # Besides rejecting a run that executed nothing, require the two OpenAPI
      # contract tests this job exists to run on a second machine: renaming,
      # skipping or filtering them out must turn this check red, not leave it
      # green with the cross-machine half of the contract guard gone.
      - name: Check test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: >
          "$(command -v python3 || command -v python)" ci/summarize-test-results.py artifacts/test-results/integration
          --require Tesserafin.Server.Integration.Tests.OpenApiContractTests.CommittedContract_MatchesRunningServer
          --require Tesserafin.Server.Integration.Tests.OpenApiContractTests.Contract_IsByteIdentical_AcrossColdGenerations
          --require Tesserafin.Server.Integration.Tests.LibraryStructureCommandsEndToEndTests.CompleteJourney_ChangesDefinitionAndPaths_ButNeverDeletesSourceMedia
          --require Tesserafin.Server.Integration.Tests.LibraryStructureCommandsEndToEndTests.HttpRead_UsesTheStructureReader_ReturnsOptionsAndLocations_AndPreservesDefinitionAndSources
          --require Tesserafin.Server.Integration.Tests.LibraryStructureCommandsEndToEndTests.ConcurrentCreates_ChooseDistinctNamesAfterAdmission_AndCanBeRemovedIndependently
          --require Tesserafin.Server.Integration.Tests.LibraryStructureCommandsEndToEndTests.FailedOptionWrite_KeepsPreviouslyPublishedOptions_AndReleasesTheMutationSlot
          --require Tesserafin.Server.Integration.Tests.ItemDeletionCommandsEndToEndTests.HttpDeletion_RemovesSourceAndCachedItem_ButConservesUserHistory
          --require Tesserafin.Server.Integration.Tests.ItemDeletionCommandsEndToEndTests.CatalogueOnlyDeletion_PromotesAlternateAndReroutesPlaylist_WithoutDeletingEitherSource
          --require Tesserafin.Server.Integration.Tests.ItemDeletionCommandsEndToEndTests.ItemChanges_AreSharedAndFollowCatalogueAndCachePublication
          --require Tesserafin.Server.Integration.Tests.ItemWriteCommandsEndToEndTests.VersionGraph_RollsBackFailedCreation_Retries_UpdatesAndPromotesMultipartAlternate
          --require Tesserafin.Server.Integration.Tests.ItemPeopleCommandsEndToEndTests.Credits_CreateOnePerson_UpdateMetadata_AndClearWithoutDeletingThePerson
          --require Tesserafin.Server.Integration.Tests.ItemPeopleCommandsEndToEndTests.PersonReads_DoNotCreate_MetadataIsPaged_AndValidationRemovesOnlyUnlockedOrphans
          --require Tesserafin.Server.Integration.Tests.EndToEnd.ExplicitItemSelectionAuthorizationEndToEndTests.SharedScope_ListTotalsAndFilterValues_StayInsideTheSelectedVisibleLibrary
          --require Tesserafin.Server.Integration.Tests.OwnedExtrasEndToEndTests.Extras_RejectsFailedSave_Retries_RefreshesAndReconcilesCatalogue_WithoutDeletingMediaOrVersions
          --require Tesserafin.Server.Integration.Tests.OwnedVideosEndToEndTests.OwnedVersions_RejectFailedCreation_RetryThroughEntityRefresh_ExposeMultipartSourcesAndPreserveMedia
          --require Tesserafin.Server.Integration.Tests.PrimaryVersionTransferEndToEndTests.FolderScan_FailedTransferRetries_DemotesAndReplacesPrimary_PreservingLinkedVersionsReferencesAndMedia
          --require Tesserafin.Server.Integration.Tests.FolderChildReconciliationEndToEndTests.CompletedDiscovery_RejectsPartialReads_RetriesFailedUpdates_ReplacesTypesAndReattachesHistory_WithoutDeletingMedia
          --require Tesserafin.Server.Integration.Tests.ShortcutLinksEndToEndTests.Shortcuts_RejectFailedSave_RetryThroughUserRootRefresh_PreserveManualAndPendingTargets_AndNeverDeleteMedia
          --require Tesserafin.Server.Integration.Tests.ItemLinkWriteCommandsEndToEndTests.Reroute_RollsBackBothSqlMutations_ThenReconcilesDeduplicatedCacheAndPreservesSources
          --require Tesserafin.Server.Integration.Tests.PlaybackIntroServiceEndToEndTests.HttpIntros_ResolveSavedVideos_FilterVisibility_AndIsolateProviderFailure_WithoutSavingCandidates
          --require Tesserafin.Server.Integration.Tests.NamedItemCatalogEndToEndTests.HttpReadsAndUnknownFilters_DoNotMaterializeNames_ExplicitWritesBecomeVisible
          --require Tesserafin.Server.Integration.Tests.NamedItemCatalogEndToEndTests.NamedWrite_FailedSqlCanRetry_AndConcurrentCreationPublishesOnce
          --require Tesserafin.Server.Integration.Tests.NamedItemCatalogEndToEndTests.AlbumArtistReads_DoNotCreate_RealFoldersWin_AndPostScanMaterializesProductionYears
          --require Tesserafin.Server.Integration.Tests.ItemImageProcessingEndToEndTests.ImageInfos_LocalizesAndPersistsDimensionsAndBlurHash_WithoutSavingTheWholeItem
