name: Adoption state application

on:
  pull_request:
    paths:
      - 'tools/adoption/**'
      - 'docs/adoption/jellyfin-state-apply.md'
      - 'docs/adoption/jellyfin-to-tesserafin.md'
      - '.github/workflows/adoption-state-apply.yml'

permissions:
  contents: read

concurrency:
  group: adoption-state-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  artifact-rehearsal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test planner, capture and apply failure boundaries
        run: python3 -m unittest discover -s tools/adoption -p 'test_*.py' -v
      - name: Prepare private build credentials and public evidence directory
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/adoption-docker-config" "$RUNNER_TEMP/adoption-evidence"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/adoption-docker-config" >> "$GITHUB_ENV"
      - name: Authenticate read-only access to pinned Web build input
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Provide the accepted F0 FFmpeg runtime (#342)
        id: f0
        uses: ./.github/actions/f0-runtime-context
        with:
          rid: linux-x64
      - name: Build the exact target candidate without publishing
        env:
          F0_CONTEXT: ${{ steps.f0.outputs.context }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          epoch="$(git show -s --format=%ct HEAD)"
          docker build --platform linux/amd64 --build-context ffmpeg-runtime="$F0_CONTEXT" \
            --build-arg VCS_REF="$CANDIDATE_SHA" \
            --build-arg SOURCE_DATE_EPOCH="$epoch" --iidfile "$RUNNER_TEMP/adoption-image-id" .
          bash docker/assert-ffmpeg-licence.sh "$(cat "$RUNNER_TEMP/adoption-image-id")"
      - name: Capture, apply, restart and conditionally roll back across real images
        run: |
          python3 tools/adoption/rehearse_state_apply.py \
            --target-image "$(cat "$RUNNER_TEMP/adoption-image-id")" \
            --expected-source "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/adoption-evidence/result.json"
      - name: Provide Node for the player journey
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Install the pinned Playwright browser
        working-directory: tools/adoption/player-resume
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      # Same image: distinct paths, two accounts with distinct positions, an
      # ambiguous duplicate and pre-filled target state; idempotency and
      # rollback before playback, then Resume in the bundled production Web.
      - name: Import from Jellyfin and resume in the real Web player
        run: |
          python3 tools/adoption/rehearse_player_resume.py \
            --target-image "$(cat "$RUNNER_TEMP/adoption-image-id")" \
            --expected-source "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/adoption-evidence/player-resume.json" \
            --artifacts "$RUNNER_TEMP/adoption-evidence/player"
      - name: Retain allowlisted image identities and result only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-state-apply-${{ github.event.pull_request.head.sha }}
          # Results hold identities, statuses and positions; the screenshots
          # show the synthetic test pattern only.
          path: |
            ${{ runner.temp }}/adoption-evidence/result.json
            ${{ runner.temp }}/adoption-evidence/player-resume.json
            ${{ runner.temp }}/adoption-evidence/player/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Remove transient registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
